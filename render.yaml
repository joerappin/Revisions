# ReviZ sur Render, offre gratuite. Les comptes et la progression sont gardés dans le dépôt privé
# joerappin/ReviZ-donnees, car le disque de l'offre gratuite est effacé à chaque redémarrage.
services:
  - type: web
    name: reviz
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: REVIZ_DATA
        value: /tmp/reviz-data
      - key: DONNEES_GIT
        value: git@github.com:joerappin/ReviZ-donnees.git
      - key: DONNEES_CLE
        sync: false          # clé SSH de déploiement (base64), jamais dans le dépôt public
      - key: ANTHROPIC_API_KEY
        sync: false          # facultatif (sinon : mode démo, ou clé collée dans Admin)
