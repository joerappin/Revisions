# ReviZ sur Render, offre gratuite. Les comptes et la progression sont gardés chez Hostinger (FTP),
# car le disque de l'offre gratuite est effacé à chaque redémarrage.
services:
  - type: web
    name: reviz
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: REVIZ_DATA
        value: /tmp/reviz-data
      - key: DONNEES_FTP
        sync: false          # ftp://utilisateur:motdepasse@hote/ : compte FTP Hostinger réservé à ReviZ, jamais dans le dépôt public
      - key: ANTHROPIC_API_KEY
        sync: false          # facultatif (sinon : mode démo, ou clé collée dans Admin)
